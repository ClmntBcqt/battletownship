name: BattleTownship build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - run: |
          dotnet tool install --global dotnet-ef
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - run: |
          mkdir -p artifact
          mkdir -p artifact/bin
          mkdir -p artifact/publish

      - run: dotnet publish -c Release -p:PublishSingleFile=true -o ../artifact/publish
        working-directory: backend/

      - run: dotnet ef migrations bundle --self-contained -o ../artifact/bin/applyMigrations
        working-directory: backend/

      - run: cp backend/deploy.sh artifact/

      - uses: actions/upload-artifact@v4
        with:
          name: battletownship-backend-${{github.ref_name}}
          path: artifact/

  build-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/flutter-setup

      - run: flutter build web --release --dart-define-from-file=config.json
        working-directory: frontend/

      - uses: actions/upload-artifact@v4
        with:
          name: battletownship-web-${{github.ref_name}}
          path: frontend/build/web

  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/flutter-setup

      - run: flutter build apk --release --dart-define-from-file=config.json
        working-directory: frontend/

      - uses: actions/upload-artifact@v4
        with:
          name: battletownship-apk-${{github.ref_name}}
          path: frontend/build/app/outputs/flutter-apk/app-release.apk

  publish-release:
    runs-on: ubuntu-24.04
    needs:
      - build-backend
      - build-web
      - build-apk

    if: github.ref_type == 'tag'

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: battletownship-backend-${{ github.ref_name }}
          path: dist/backend/

      - uses: actions/download-artifact@v4
        with:
          name: battletownship-web-${{ github.ref_name }}
          path: dist/web/

      - uses: actions/download-artifact@v4
        with:
          name: battletownship-apk-${{ github.ref_name }}
          path: dist/apk/

      - env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist/release

          tar -czf "dist/release/battletownship-backend-${TAG}.tar.gz" -C dist/backend .

          tar -czf "dist/release/battletownship-web-${TAG}.tar.gz" -C dist/web .

          cp dist/apk/app-release.apk "dist/release/battletownship-${TAG}.apk"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: BattleTownship ${{ github.ref_name }}
          files: |
            dist/release/battletownship-backend-${{ github.ref_name }}.tar.gz
            dist/release/battletownship-web-${{ github.ref_name }}.tar.gz
            dist/release/battletownship-${{ github.ref_name }}.apk
